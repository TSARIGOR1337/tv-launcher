name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing key
        run: base64 -d app/signing/release.jks.b64 > app/signing/release.jks

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK (release "latest")
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk
          gh release delete ci-failed -y --cleanup-tag || true
          gh release delete latest -y --cleanup-tag || true
          gh release create latest tv-launcher.apk build.log \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"

      - name: Publish build log on failure (release "ci-failed")
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          grep -nE "^e: |error:|FAILURE|What went wrong" -A3 build.log > errors.log || true
          tail -c 300000 build.log > build-failed.log
          gh release delete ci-failed -y --cleanup-tag || true
          gh release create ci-failed errors.log build-failed.log \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "FAILED build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"
